name: Update version.json

# هر بار که یک Release منتشر شود، فایل version.json خودکار با شماره‌ی تگ همان Release به‌روز می‌شود.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write version.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          VER="${TAG#v}"
          jq -n --arg v "$VER" --arg body "$BODY" '
            ($body | gsub("\r"; "") | split("\n") | map(select(length > 0)) | .[0:5]) as $lines
            | {version: $v, apk: "https://tadabbur-update.balgold224.workers.dev/tadabbur.apk"}
              + (if ($lines | length) > 0 then {notes: {fa: $lines, en: $lines, ar: $lines}} else {} end)
          ' > version.json
          cat version.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add version.json
          git commit -m "version $VER" || exit 0
          git push
